AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Amethyst & Ash, one-time: the Route 53 hosted zone. Finishes right away.
  Copy the NameServers output into Wix ("Use custom nameservers"), then deploy dns-cert.yml.

Parameters:
  DomainName:
    Type: String
    Default: amethystandashcoaching.com
  # Proves to Google Search Console that we own the domain. Not a secret: anyone can look it up.
  GoogleSiteVerification:
    Type: String
    Default: google-site-verification=YKc4l7I1Wft7l7cPco-JvAkVvjyD8Thdj0Hjx_W0Hvg
    Description: e.g. google-site-verification=abc123

Conditions:
  HasGoogleSiteVerification: !Not [!Equals [!Ref GoogleSiteVerification, ""]]

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: Amethyst & Ash (registered at Wix, DNS here)

  # TXT records on the bare domain. Add other verifications (Bing, email providers) to this list.
  # A domain can have only ONE SPF ("v=spf1 ...") value: add new senders as another include:
  # in that same line (e.g. Sender.net), never as a second SPF entry
  RootTxt:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: TXT
      TTL: "300"
      ResourceRecords:
        # ImprovMX (forwarding) + Sender.net (newsletters and quiz emails)
        - '"v=spf1 include:spf.improvmx.com include:sendersrv.com ~all"'
        - !If
          - HasGoogleSiteVerification
          - !Sub '"${GoogleSiteVerification}"'
          - !Ref AWS::NoValue

  # Incoming email: ImprovMX forwards mail sent to @amethystandashcoaching.com
  # (e.g. hello@) to an existing inbox. Aliases are managed in the ImprovMX dashboard
  Mx:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: MX
      TTL: "300"
      ResourceRecords:
        - 10 mx1.improvmx.com
        - 20 mx2.improvmx.com

  # Tells inboxes what to do with mail that fails SPF/DKIM. p=none only monitors, it never
  # blocks anything. Gmail and Yahoo expect a DMARC record from anyone sending newsletters
  Dmarc:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub _dmarc.${DomainName}
      Type: TXT
      TTL: "300"
      ResourceRecords:
        - '"v=DMARC1; p=none;"'

  # Sender.net signs its emails with this key, so inboxes can tell they really came from us
  SenderDkim:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub sender._domainkey.${DomainName}
      Type: CNAME
      TTL: "300"
      ResourceRecords:
        - dkim.sendersrv.com

Outputs:
  HostedZoneId:
    Value: !Ref HostedZone
    Export:
      Name: amethystandash-hosted-zone-id
  NameServers:
    Description: Paste these 4 into Wix
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
